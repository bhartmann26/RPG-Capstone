name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      # TODO: add the system depedencies
      - name: Install dependencies
        run: npm install

      - name: Build Vite + React app
        run: npm run build

      - name: Run Jest tests with coverage
        run: npx jest --coverage
